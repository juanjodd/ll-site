<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lloverllover</title>
  <meta name="description" content="Lluvia medida y prevista, día a día, en un punto de la red SAIH del sur de España">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <!-- ?v= is the cache-buster: bump it here (all three pages) whenever the
       CSS, JS or i18n.json changes — see js/plot.js. -->
  <link rel="stylesheet" href="css/style.css?v=3.7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🌧️</text></svg>">
</head>
<body class="station-page">
  <!-- v3.5 (Phase 17): the page per place.  ONE file serves all 294: station.js reads
       ?n=ID and renders the ten-day pair series, the day-by-day table and a zoomed
       map, all from the same data.json the map page uses.  The header keeps only the
       logo (which is the way back) and the language toggle. -->
  <header class=solo>
    <h1><a href="index.html">llover<span>llover</span></a></h1>
    <nav id="lang" aria-label="Language">
      <button data-lang="es">ES</button><button data-lang="en">EN</button>
    </nav>
  </header>

  <main>
    <section id="place"><p class="hint">…</p></section>

    <section id="stseries-wrap">
      <h2 data-i18n="series_title">Diez días de memoria, y lo que queda previsto</h2>
      <div id="stseries"></div>
    </section>

    <section id="sttable-wrap">
      <h2 data-i18n="table_title">Día a día</h2>
      <div id="sttable"></div>
    </section>

    <div id="stmap" role="img" aria-label="map"></div>
  </main>

  <footer><p id="foot">…</p></footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/plot.js?v=3.7"></script>
  <script src="js/station.js?v=3.7"></script>
</body>
</html>
